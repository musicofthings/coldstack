# Publish site/ to GitHub Pages.
#
# Branch deployment ("deploy from a branch") only offers the repository root or /docs -
# there is no way to pick site/ there. /docs already holds the architecture documents,
# which are written to be read on GitHub rather than served as a website, so the folder
# stays where it is and Pages is driven from Actions instead.
#
# ONE-TIME SETUP: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# Until that is switched, configure-pages fails in a few seconds with "Get Pages site
# failed. Please verify that the repository has Pages enabled and configured to build
# using GitHub Actions" - and, because Pages is still in branch mode, GitHub keeps
# running its own `pages-build-deployment` workflow against the repository root, which
# has no index.html. That combination is what serves a 404.
#
# configure-pages can flip the setting itself via `enablement: true`, but that input
# explicitly requires a token other than GITHUB_TOKEN - a PAT with repo scope, or an
# App with administration:write. Storing a PAT to save one dropdown is a bad trade, so
# this stays manual.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # Actions -> Pages -> "Run workflow", to deploy on demand

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The page must be a complete standalone document
        # It is hand-written with no build step, so a missing <body> or a stylesheet
        # left outside <head> would ship silently. Both happened once already.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          s = pathlib.Path("site/index.html").read_text()
          problems = []
          for tag in ("<!doctype html>", "<html lang=", "<head>", "</head>",
                      "<body>", "</body>", "</html>", "<title>"):
              if tag not in s:
                  problems.append(f"missing {tag}")
          if s.count("<body>") != 1 or s.count("</body>") != 1:
              problems.append("body tag is not balanced")
          if "<style>" in s and s.index("<style>") > s.index("</head>"):
              problems.append("<style> sits outside <head>")
          if "fonts.googleapis.com" in s and s.index("fonts.googleapis.com") > s.index("</head>"):
              problems.append("font stylesheet sits outside <head>")
          # Every custom property must exist in the bare :root block, or one theme
          # renders unstyled.
          root = re.search(r":root\{(.*?)\n\}", s, re.S)
          if root:
              undeclared = set(re.findall(r"var\((--[a-z-]+)", s)) - set(
                  re.findall(r"(--[a-z-]+):", root.group(1)))
              if undeclared:
                  problems.append(f"CSS variables not declared in :root: {sorted(undeclared)}")
          if problems:
              print("\n".join(f"FAIL: {p}" for p in problems)); sys.exit(1)
          print(f"site/index.html OK ({len(s):,} bytes)")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
