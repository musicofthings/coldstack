name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt
      - run: pip install -r services/worker/requirements.txt
      - run: python -m pytest -q
        working-directory: services/worker

  migrations:
    # The schema has real logic in it - policy triggers that stop a cold campaign
    # binding a bulk ESP. Applying the files in order and exercising those triggers
    # is the only way to know they still hold.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coldstack
          POSTGRES_PASSWORD: coldstack
          POSTGRES_DB: coldstack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coldstack" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration in order
        env: {PGPASSWORD: coldstack}
        run: |
          for f in db/migrations/*.sql; do
            echo "-> $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U coldstack -d coldstack -f "$f"
          done
      - name: The ESP policy triggers must still refuse a cold binding
        env: {PGPASSWORD: coldstack}
        run: |
          psql -q -h localhost -U coldstack -d coldstack <<'SQL'
          INSERT INTO workspace (id,name,dek_wrapped) VALUES
            ('11111111-1111-1111-1111-111111111111','t','\x00'::bytea);
          INSERT INTO campaign (id,workspace_id,name,campaign_class) VALUES
            ('22222222-2222-2222-2222-222222222222','11111111-1111-1111-1111-111111111111','cold','cold'),
            ('33333333-3333-3333-3333-333333333333','11111111-1111-1111-1111-111111111111','optin','opt_in');
          INSERT INTO sender (id,workspace_id,transport,family,cold_safe,label,from_email) VALUES
            ('aaaaaaaa-0000-0000-0000-000000000001','11111111-1111-1111-1111-111111111111','resend','esp',false,'r','a@e.com');
          SQL
          # 1. binding an ESP to a cold campaign must fail
          if psql -q -h localhost -U coldstack -d coldstack \
               -c "INSERT INTO campaign_sender VALUES ('22222222-2222-2222-2222-222222222222','aaaaaaaa-0000-0000-0000-000000000001');" 2>/dev/null; then
            echo "FAIL: an ESP was bound to a cold campaign"; exit 1
          fi
          # 2. the reclassification bypass closed in 0003 must stay closed
          psql -q -v ON_ERROR_STOP=1 -h localhost -U coldstack -d coldstack \
            -c "INSERT INTO campaign_sender VALUES ('33333333-3333-3333-3333-333333333333','aaaaaaaa-0000-0000-0000-000000000001');"
          if psql -q -h localhost -U coldstack -d coldstack \
               -c "UPDATE campaign SET campaign_class='cold' WHERE id='33333333-3333-3333-3333-333333333333';" 2>/dev/null; then
            echo "FAIL: an opt-in campaign with an ESP bound was reclassified to cold"; exit 1
          fi
          echo "both policy triggers held"

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next build

  landing-page:
    # index.html is hand-written and served straight from the repo root by GitHub Pages,
    # so nothing else would catch a malformed document. Two of these went wrong once:
    # a wrapper that closed a <body> it never opened, and a stylesheet left outside <head>.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html must be a complete standalone document
        run: python3 .github/scripts/check_landing_page.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credential-shaped strings outside test fixtures
        run: |
          if git grep -nIE '(sk_live_[A-Za-z0-9]{8,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-|-----BEGIN [A-Z ]*PRIVATE KEY)' \
               -- . ':(exclude)services/worker/tests' ':(exclude).github'; then
            echo "possible credential committed"; exit 1
          fi
          echo "clean"
